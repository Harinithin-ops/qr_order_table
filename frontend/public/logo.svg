<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Arch of stars -->
  <g fill="#4a781b">
    <polygon points="120,110 125,120 135,120 127,127 130,137 120,131 110,137 113,127 105,120 115,120" transform="rotate(-30 120 123) scale(0.8)"/>
    <polygon points="150,90 155,100 165,100 157,107 160,117 150,111 140,117 143,107 135,100 145,100" transform="rotate(-15 150 103) scale(0.9)"/>
    <polygon points="180,85 185,95 195,95 187,102 190,112 180,106 170,112 173,102 165,95 175,95" transform="rotate(-5 180 98) scale(0.9)"/>
    
    <!-- Right side stars -->
    <polygon points="220,85 225,95 235,95 227,102 230,112 220,106 210,112 213,102 205,95 215,95" transform="rotate(5 220 98) scale(0.9)"/>
    <polygon points="250,90 255,100 265,100 257,107 260,117 250,111 240,117 243,107 235,100 245,100" transform="rotate(15 250 103) scale(0.9)"/>
    <polygon points="280,110 285,120 295,120 287,127 290,137 280,131 270,137 273,127 265,120 275,120" transform="rotate(30 280 123) scale(0.8)"/>
  </g>

  <!-- Chef Hat -->
  <g fill="#4a781b">
    <path d="M 180,80 C 170,80 170,60 185,60 C 185,45 200,40 210,50 C 225,40 235,55 230,65 C 240,65 240,80 230,85 L 225,95 L 185,95 Z" />
    <rect x="186" y="90" width="38" height="15" rx="3" />
  </g>

  <!-- Left Wreath -->
  <path d="M 200,320 A 130 130 0 0 1 110,130" fill="none" stroke="#4a781b" stroke-width="6" stroke-linecap="round"/>
  <!-- Left Leaves (simplified) -->
  <g fill="#4a781b">
    <path d="M 107,140 Q 95,130 90,145 Q 100,150 107,140" />
    <path d="M 103,160 Q 88,150 83,165 Q 98,175 103,160" />
    <path d="M 100,180 Q 85,170 80,185 Q 95,195 100,180" />
    <path d="M 98,200 Q 80,195 78,210 Q 93,215 98,200" />
    <path d="M 100,220 Q 82,215 80,230 Q 95,235 100,220" />
    <path d="M 105,240 Q 85,240 85,255 Q 100,255 105,240" />
    <path d="M 113,260 Q 95,263 97,278 Q 112,275 113,260" />
    <path d="M 125,280 Q 108,285 112,300 Q 125,295 125,280" />
  </g>

  <!-- Right Wreath -->
  <path d="M 200,320 A 130 130 0 0 0 290,130" fill="none" stroke="#4a781b" stroke-width="6" stroke-linecap="round"/>
  <!-- Right Leaves -->
  <g fill="#4a781b">
    <path d="M 293,140 Q 305,130 310,145 Q 300,150 293,140" />
    <path d="M 297,160 Q 312,150 317,165 Q 302,175 297,160" />
    <path d="M 300,180 Q 315,170 320,185 Q 305,195 300,180" />
    <path d="M 302,200 Q 320,195 322,210 Q 307,215 302,200" />
    <path d="M 300,220 Q 318,215 320,230 Q 305,235 300,220" />
    <path d="M 295,240 Q 315,240 315,255 Q 300,255 295,240" />
    <path d="M 287,260 Q 305,263 303,278 Q 288,275 287,260" />
    <path d="M 275,280 Q 292,285 288,300 Q 275,295 275,280" />
  </g>

  <!-- Center KH Text -->
  <!-- We'll stylize K and H intertwined -->
  <g fill="#dd2a20">
    <!-- Letter K -->
    <path d="M 130,130 L 150,130 L 150,190 L 195,130 L 220,130 L 175,185 L 225,260 L 200,260 L 160,200 L 150,210 L 150,260 L 130,260 Z" />
    <!-- Letter H -->
    <path d="M 210,145 L 230,145 L 230,185 L 265,185 L 265,145 L 285,145 L 285,260 L 265,260 L 265,205 L 230,205 L 230,260 L 210,260 Z" />
    <!-- Swirl on the H crossbar to match menu card -->
    <path d="M 220,200 Q 240,160 260,200 Q 250,220 240,200" fill="none" stroke="#dd2a20" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Bottom Red Ribbon -->
  <g fill="#dd2a20">
    <!-- Ribbon tails -->
    <path d="M 80,310 L 160,280 L 160,330 L 70,330 Z" />
    <path d="M 320,310 L 240,280 L 240,330 L 330,330 Z" />
    
    <!-- Main Ribbon Arc -->
    <path d="M 90,290 Q 200,250 310,290 L 330,320 Q 200,280 70,320 Z" />
  </g>
  
  <!-- KAVITHA HOTEL text on Ribbon -->
  <!-- Needs an SVG arc path matching the ribbon -->
  <path id="ribbonPath" d="M 95,305 Q 200,265 305,305" fill="none" />
  <text fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="28" letter-spacing="1">
    <textPath href="#ribbonPath" startOffset="50%" text-anchor="middle">
      KAVITHA HOTEL
    </textPath>
  </text>
  
</svg>
