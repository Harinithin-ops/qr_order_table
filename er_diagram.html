<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Food Ordering System — ER Diagram</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #090912;
      overflow: hidden;
      width: 100vw; height: 100vh;
    }

    #toolbar {
      position: fixed; top:0; left:0; right:0; height:50px;
      background: rgba(9,9,18,0.97);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display:flex; align-items:center; justify-content:space-between;
      padding: 0 24px; z-index:100;
    }
    #toolbar h1 {
      font-size:14px; font-weight:700; letter-spacing:-0.3px;
      background: linear-gradient(90deg,#c4b5fd,#93c5fd);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    #toolbar .btns { display:flex; gap:6px; align-items:center; }
    #toolbar button {
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09);
      color:#aaa; border-radius:7px; cursor:pointer; font-family:inherit;
      font-size:14px; width:30px; height:30px; display:flex;
      align-items:center; justify-content:center; transition:all .15s;
    }
    #toolbar button:hover { background:rgba(255,255,255,0.12); color:#fff; }
    #toolbar .zl { font-size:11px; color:#555; min-width:42px; text-align:center; font-weight:600; }
    .rbtn { width:auto !important; padding:0 12px !important; font-size:12px !important; }

    #legend {
      position:fixed; bottom:16px; left:16px;
      background:rgba(14,14,26,0.96);
      border:1px solid rgba(255,255,255,0.07); border-radius:12px;
      padding:14px 18px; z-index:100; font-size:11.5px;
    }
    #legend h3 { font-size:10px; font-weight:700; text-transform:uppercase;
      letter-spacing:.9px; color:#555; margin-bottom:12px; }
    .li { display:flex; align-items:center; gap:9px; color:#aaa; margin-bottom:8px; }
    .li:last-child { margin-bottom:0; }
    .li svg { flex-shrink:0; }

    #wrap { width:100%; height:100%; padding-top:50px; }
    #cv { width:100%; height:100%; cursor:grab; }
    #cv:active { cursor:grabbing; }

    /* Entity */
    .ent-rect {
      stroke-width:2.5;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55));
    }
    .ent-label {
      font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px;
      fill:#fff; text-anchor:middle; dominant-baseline:central;
      pointer-events:none;
    }

    /* Attribute */
    .a-ell  { stroke-width:1.1; }
    .a-txt  { font-family:'Inter',sans-serif; font-weight:400; font-size:9px;
              fill:#c0c0c0; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
    .pk-ell { stroke-width:1.5; }
    .pk-txt { font-family:'Inter',sans-serif; font-weight:700; font-size:9px;
              fill:#fbbf24; text-anchor:middle; dominant-baseline:central;
              text-decoration:underline; pointer-events:none; }

    /* Relationship */
    .rel-dia { stroke-width:2; filter:drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
    .rel-txt { font-family:'Inter',sans-serif; font-weight:700; font-size:9.5px;
               fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none; }

    /* Lines */
    .ln  { fill:none; }
    .card { font-family:'Inter',sans-serif; font-size:11.5px; font-weight:800;
            fill:#fbbf24; text-anchor:middle; dominant-baseline:central; pointer-events:none; }

    /* Tooltip */
    #tip {
      position:fixed; background:rgba(16,16,28,0.97); backdrop-filter:blur(10px);
      border:1px solid rgba(167,139,250,0.2); border-radius:9px;
      padding:10px 14px; z-index:200; pointer-events:none;
      opacity:0; transition:opacity .12s; max-width:240px; font-size:11.5px;
      box-shadow:0 8px 28px rgba(0,0,0,.5);
    }
    #tip.show { opacity:1; }
    #tip h4 { font-size:12.5px; font-weight:700; margin-bottom:5px; color:#c4b5fd; }
    .trow { display:flex; align-items:center; gap:5px; color:#999; margin-bottom:2px; }
    .trow.pk { color:#fbbf24; font-weight:600; }
    .badge {
      font-size:8.5px; padding:1px 4px; border-radius:3px; font-weight:700;
      background:rgba(251,191,36,.18); color:#fbbf24;
    }
    .badge.fk { background:rgba(96,165,250,.18); color:#60a5fa; }
  </style>
</head>
<body>

<div id="toolbar">
  <h1>QR Food Ordering System — Entity Relationship Diagram</h1>
  <div class="btns">
    <button onclick="zi()" title="Zoom In">+</button>
    <span class="zl" id="zl">100%</span>
    <button onclick="zo()" title="Zoom Out">−</button>
    <button class="rbtn" onclick="rv()">Reset</button>
  </div>
</div>

<div id="legend">
  <h3>Legend</h3>
  <div class="li">
    <svg width="26" height="15"><rect x="1" y="1" width="24" height="13" rx="3"
      fill="rgba(167,139,250,.1)" stroke="#a78bfa" stroke-width="1.4"/></svg>
    <span>Entity (Rectangle)</span>
  </div>
  <div class="li">
    <svg width="26" height="15"><ellipse cx="13" cy="7.5" rx="12" ry="6"
      fill="rgba(96,165,250,.07)" stroke="#60a5fa" stroke-width="1"/></svg>
    <span>Attribute (Ellipse)</span>
  </div>
  <div class="li">
    <svg width="26" height="15"><ellipse cx="13" cy="7.5" rx="12" ry="6"
      fill="rgba(251,191,36,.07)" stroke="#fbbf24" stroke-width="1.2"/></svg>
    <span style="text-decoration:underline;color:#fbbf24;">Primary Key</span>
  </div>
  <div class="li">
    <svg width="26" height="17"><polygon points="13,1 25,8.5 13,16 1,8.5"
      fill="rgba(251,146,60,.1)" stroke="#fb923c" stroke-width="1.4"/></svg>
    <span>Relationship (Diamond)</span>
  </div>
  <div class="li">
    <svg width="26" height="4"><line x1="0" y1="2" x2="26" y2="2"
      stroke="rgba(255,255,255,.2)" stroke-width="1.4"/></svg>
    <span>1 / N = Cardinality</span>
  </div>
</div>

<div id="tip"></div>
<div id="wrap"><svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg></div>

<script>
// ══════════════════════════════════════════════════════
// PROFESSIONAL HIERARCHICAL LAYOUT
// Canvas: 3400 × 2100
// ══════════════════════════════════════════════════════

/* ── Entity definitions ──────────────────────────────
   Each entity has a fixed (x,y) center in the SVG
   coordinate space. Attributes are distributed
   around it at fixed angles (clockwise from top).
   ─────────────────────────────────────────────────── */
const ENT = [
  // ── TOP ROW (Menu hierarchy) ──────────────────────
  {
    id:'MenuCategory', x:2700, y:250, c:'#e879f9',
    attrAngles:[315,0,45,90],                         // 4 attrs clockwise
    attrs:[{n:'id',pk:1},{n:'name'},{n:'image'},{n:'displayOrder'}]
  },
  {
    id:'MenuItem', x:2700, y:850, c:'#facc15',
    attrAngles:[270,315,0,45,90,135,180,225,250,300,330],
    attrs:[
      {n:'id',pk:1},{n:'name'},{n:'description'},{n:'price'},
      {n:'image'},{n:'available'},{n:'categoryId',fk:1},
      {n:'prepTime'},{n:'tags'},{n:'suggestedItemIds'},{n:'createdAt'}
    ]
  },

  // ── LEFT COLUMN ───────────────────────────────────
  {
    id:'AuditLog', x:250, y:250, c:'#94a3b8',
    attrAngles:[270,315,0,45],
    attrs:[{n:'id',pk:1},{n:'audit_action'},{n:'audit_timestamp'},{n:'details'}]
  },
  {
    id:'Branch', x:250, y:700, c:'#a78bfa',
    attrAngles:[240,280,320,360,40,80],
    attrs:[{n:'id',pk:1},{n:'name'},{n:'address'},{n:'phone'},{n:'gstNumber'},{n:'createdAt'}]
  },
  {
    id:'Waiter', x:250, y:1150, c:'#34d399',
    attrAngles:[240,280,320,360,40,80,120],
    attrs:[{n:'id',pk:1},{n:'username'},{n:'email'},{n:'passwordHash'},{n:'displayName'},{n:'isDisabled'},{n:'createdAt'}]
  },
  {
    id:'BillMergeHistory', x:250, y:1700, c:'#c084fc',
    attrAngles:[240,280,320,0,40,80],
    attrs:[{n:'merge_id',pk:1},{n:'parent_bill_id'},{n:'child_bill_id'},{n:'merged_by'},{n:'merged_at'},{n:'merge_reason'}]
  },

  // ── CENTER ROW ────────────────────────────────────
  {
    id:'CustomerSession', x:900, y:250, c:'#4ade80',
    attrAngles:[300,0,60,120,180],
    attrs:[{n:'id',pk:1},{n:'phone'},{n:'tableId',fk:1},{n:'createdAt'},{n:'expiresAt'}]
  },
  {
    id:'Table', x:900, y:700, c:'#60a5fa',
    attrAngles:[220,255,290,325,355,30,65,100,140],
    attrs:[
      {n:'id',pk:1},{n:'tableNumber'},{n:'slug'},{n:'qrCodeUrl'},
      {n:'branchId',fk:1},{n:'active'},{n:'callingWaiter'},
      {n:'assignedWaiterId',fk:1},{n:'createdAt'}
    ]
  },
  {
    id:'BillGroup', x:900, y:1450, c:'#38bdf8',
    attrAngles:[270,315,0,45],
    attrs:[{n:'id',pk:1},{n:'tableId'},{n:'phone_number'},{n:'createdAt'}]
  },

  // ── CENTER-RIGHT ──────────────────────────────────
  {
    id:'Order', x:1600, y:700, c:'#f472b6',
    attrAngles:[220,255,285,315,350,15,45,75,110],
    attrs:[
      {n:'id',pk:1},{n:'tableId',fk:1},{n:'status'},{n:'total'},
      {n:'notes'},{n:'customerId'},{n:'phone_number'},{n:'createdAt'},{n:'updatedAt'}
    ]
  },
  {
    id:'Bill', x:1600, y:1300, c:'#2dd4bf',
    attrAngles:[190,215,240,265,290,315,340,5,30,55,80,105,130,155,175,200,220],
    attrs:[
      {n:'id',pk:1},{n:'orderId',fk:1},{n:'phone_number'},{n:'subtotal'},
      {n:'taxRate'},{n:'taxAmount'},{n:'serviceCharge'},{n:'discount'},
      {n:'total'},{n:'paymentStatus'},{n:'paymentMethod'},{n:'paymentReference'},
      {n:'billNumber'},{n:'customItems'},{n:'is_merged'},{n:'merged_bill_id'},{n:'group_id',fk:1}
    ]
  },
  {
    id:'MergedBill', x:1600, y:1850, c:'#f87171',
    attrAngles:[270,315,45,135],
    attrs:[{n:'id',pk:1},{n:'parent_bill_id'},{n:'child_bill_id'},{n:'createdAt'}]
  },

  // ── RIGHT ─────────────────────────────────────────
  {
    id:'OrderItem', x:2200, y:1050, c:'#fb923c',
    attrAngles:[220,265,305,345,20,65,105],
    attrs:[
      {n:'id',pk:1},{n:'orderId',fk:1},{n:'menuItemId',fk:1},
      {n:'quantity'},{n:'price'},{n:'specialInstructions'},{n:'isUnavailable'}
    ]
  }
];

/* ── Relationships ────────────────────────────────── */
const REL = [
  { from:'Branch',       to:'Table',             label:'Has',        c1:'1', cN:'N', color:'#a78bfa' },
  { from:'Waiter',       to:'Table',             label:'Assigned',   c1:'1', cN:'N', color:'#34d399' },
  { from:'Table',        to:'CustomerSession',   label:'Sessions',   c1:'1', cN:'N', color:'#4ade80' },
  { from:'Table',        to:'Order',             label:'Places',     c1:'1', cN:'N', color:'#60a5fa' },
  { from:'Order',        to:'OrderItem',         label:'Contains',   c1:'1', cN:'N', color:'#f472b6' },
  { from:'MenuItem',     to:'OrderItem',         label:'Refers',     c1:'1', cN:'N', color:'#facc15' },
  { from:'MenuCategory', to:'MenuItem',          label:'Categorizes',c1:'1', cN:'N', color:'#e879f9' },
  { from:'Order',        to:'Bill',              label:'Generates',  c1:'1', cN:'1', color:'#2dd4bf' },
  { from:'BillGroup',    to:'Bill',              label:'Groups',     c1:'1', cN:'N', color:'#38bdf8' },
  { from:'Bill',         to:'MergedBill',        label:'Merges',     c1:'1', cN:'N', color:'#f87171' },
  { from:'Bill',         to:'BillMergeHistory',  label:'Logs',       c1:'1', cN:'N', color:'#c084fc' },
];

// ══════════════════════════════════════════════════════
// RENDER ENGINE
// ══════════════════════════════════════════════════════

const svg = document.getElementById('cv');
const NS  = 'http://www.w3.org/2000/svg';
const tip = document.getElementById('tip');

function mk(tag, a = {}) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(a)) e.setAttribute(k, v);
  return e;
}
function rgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function deg2rad(d) { return d * Math.PI / 180; }

// ── ViewBox & Pan/Zoom ──────────────────────────────
let vb = {x:-80, y:-80, w:3560, h:2260};
let sc = 1, drag=false, dp={x:0,y:0}, vp={x:0,y:0};

function syncVB() { svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
syncVB();

function zi() { sc = Math.min(sc*1.25,6); az(); }
function zo() { sc = Math.max(sc/1.25,.15); az(); }
function az() {
  const cx=vb.x+vb.w/2, cy=vb.y+vb.h/2;
  vb.w=3560/sc; vb.h=2260/sc;
  vb.x=cx-vb.w/2; vb.y=cy-vb.h/2;
  syncVB(); document.getElementById('zl').textContent=Math.round(sc*100)+'%';
}
function rv() {
  sc=1; vb={x:-80,y:-80,w:3560,h:2260}; syncVB();
  document.getElementById('zl').textContent='100%';
}

svg.addEventListener('mousedown', e => {
  if (e.button!==0) return;
  drag=true; dp={x:e.clientX,y:e.clientY}; vp={x:vb.x,y:vb.y};
});
svg.addEventListener('mousemove', e => {
  if (!drag) return;
  vb.x = vp.x-(e.clientX-dp.x)*(vb.w/svg.clientWidth);
  vb.y = vp.y-(e.clientY-dp.y)*(vb.h/svg.clientHeight);
  syncVB();
});
window.addEventListener('mouseup', () => drag=false);
svg.addEventListener('wheel', e => { e.preventDefault(); e.deltaY<0?zi():zo(); },{passive:false});

// ── SVG Layers ──────────────────────────────────────
const lLines = mk('g',{id:'l-lines'});
const lAttrs = mk('g',{id:'l-attrs'});
const lRels  = mk('g',{id:'l-rels'});
const lEnts  = mk('g',{id:'l-ents'});
svg.append(lLines, lAttrs, lRels, lEnts);

// ── Build lookup ─────────────────────────────────────
const entMap = {};
ENT.forEach(e => { entMap[e.id] = e; });

// ── Draw relationships (lines + diamonds) ─────────────
REL.forEach(rel => {
  const A = entMap[rel.from], B = entMap[rel.to];
  if (!A || !B) return;
  const mx = (A.x+B.x)/2, my = (A.y+B.y)/2;
  const lc = rgba(rel.color, 0.28);

  // Lines
  [lLines.appendChild(mk('line',{x1:A.x,y1:A.y,x2:mx,y2:my,stroke:lc,'stroke-width':'2',class:'ln'})),
   lLines.appendChild(mk('line',{x1:mx,y1:my,x2:B.x,y2:B.y,stroke:lc,'stroke-width':'2',class:'ln'}))];

  // Diamond
  const dw=54, dh=30;
  const dia = mk('g',{class:'rel-grp'});
  dia.appendChild(mk('polygon',{
    class:'rel-dia',
    points:`${mx},${my-dh} ${mx+dw},${my} ${mx},${my+dh} ${mx-dw},${my}`,
    fill: rgba(rel.color,.1), stroke:rel.color
  }));
  const rt = mk('text',{class:'rel-txt',x:mx,y:my});
  rt.textContent = rel.label;
  dia.appendChild(rt);
  lRels.appendChild(dia);

  // Cardinality
  const dist = Math.hypot(B.x-A.x, B.y-A.y);
  const ux=(B.x-A.x)/dist, uy=(B.y-A.y)/dist;
  const off=110, px=-uy*15, py=ux*15;

  const t1=mk('text',{class:'card',x:A.x+ux*off+px,y:A.y+uy*off+py});
  t1.textContent=rel.c1; lRels.appendChild(t1);
  const t2=mk('text',{class:'card',x:B.x-ux*off+px,y:B.y-uy*off+py});
  t2.textContent=rel.cN; lRels.appendChild(t2);
});

// ── Draw entities + attributes ─────────────────────
ENT.forEach(ent => {
  const {x,y,c,attrs,attrAngles} = ent;
  const rX = 140 + Math.max(0, attrs.length-7)*9;
  const rY = 105 + Math.max(0, attrs.length-7)*7;

  // Attribute lines + ellipses
  attrs.forEach((a, i) => {
    const angle = deg2rad(attrAngles[i] ?? (360*i/attrs.length));
    const ax = x + rX*Math.cos(angle);
    const ay = y + rY*Math.sin(angle);
    const ew = Math.max(a.n.length*6+16, 48), eh = 19;
    const isPK = a.pk, isFk = a.fk;

    lLines.appendChild(mk('line',{
      x1:x,y1:y,x2:ax,y2:ay,
      stroke: rgba(c,.13),'stroke-width':'1',class:'ln'
    }));

    const ag = mk('g');
    ag.appendChild(mk('ellipse',{
      class: isPK?'pk-ell':'a-ell',
      cx:ax,cy:ay,rx:ew/2,ry:eh/2,
      fill: isPK?'rgba(251,191,36,.05)':rgba(c,.04),
      stroke: isPK?'#fbbf24': isFk?'rgba(96,165,250,.55)':rgba(c,.38)
    }));
    const at=mk('text',{class:isPK?'pk-txt':'a-txt',x:ax,y:ay});
    at.textContent=a.n;
    ag.appendChild(at);
    lAttrs.appendChild(ag);
  });

  // Entity rectangle
  const g = mk('g',{class:'ent-grp'});
  const w=162, h=44, rx=8;
  g.appendChild(mk('rect',{
    class:'ent-rect',
    x:x-w/2,y:y-h/2,width:w,height:h,rx,ry:rx,
    fill:rgba(c,.11),stroke:c
  }));
  const lbl=mk('text',{class:'ent-label',x,y});
  lbl.textContent=ent.id;
  g.appendChild(lbl);

  // Tooltip
  g.addEventListener('mouseenter', () => {
    let html=`<h4>${ent.id}</h4>`;
    attrs.forEach(a => {
      const cls = a.pk?'trow pk':'trow';
      const badge = a.pk?'<span class="badge">PK</span>':a.fk?'<span class="badge fk">FK</span>':'';
      html+=`<div class="${cls}">${badge} ${a.n}</div>`;
    });
    tip.innerHTML=html; tip.classList.add('show');
  });
  g.addEventListener('mousemove', e => {
    tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+8)+'px';
  });
  g.addEventListener('mouseleave', () => tip.classList.remove('show'));
  lEnts.appendChild(g);
});
</script>
</body>
</html>
